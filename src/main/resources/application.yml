spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  application:
    name: vium-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: dispose-batch-
      shutdown:
        await-termination: true
        await-termination-period: 60s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      env: ${DEPLOY_ENV:local}
    distribution:
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:}
        headers:
          Authorization: ${OTLP_METRICS_AUTHORIZATION:}
        step: 1m
        base-time-unit: seconds
        compression-mode: gzip
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${DEPLOY_ENV:local}

logging:
  level:
    org.hibernate.SQL: debug

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  timeout-seconds: 60
  detail-timeout-seconds: 25

unsplash:
  access-key: ${UNSPLASH_ACCESS_KEY}
  timeout-seconds: 3

recipe:
  image-backfill:
    enabled: ${RECIPE_IMAGE_BACKFILL_ENABLED:false}
    cron: ${RECIPE_IMAGE_BACKFILL_CRON:0 20 * * * *}
    time-zone: ${RECIPE_IMAGE_BACKFILL_TIMEZONE:Asia/Seoul}
    batch-size: ${RECIPE_IMAGE_BACKFILL_BATCH_SIZE:10}

disposal:
  auto-dispose:
    enabled: ${DISPOSAL_AUTO_DISPOSE_ENABLED:false}
    cron: ${DISPOSAL_AUTO_DISPOSE_CRON:0 10 0 * * *}
    time-zone: ${DISPOSAL_AUTO_DISPOSE_TIMEZONE:Asia/Seoul}

post:
  expiry:
    enabled: ${POST_EXPIRY_ENABLED:false}
    cron: ${POST_EXPIRY_CRON:0 0 0 * * *}
    time-zone: ${POST_EXPIRY_TIMEZONE:Asia/Seoul}

credit:
  daily-reward:
    amount: ${CREDIT_DAILY_REWARD_AMOUNT:1}

ai-report:
  cost: ${AI_REPORT_COST:5}

auth:
  session-cleanup:
    enabled: ${AUTH_SESSION_CLEANUP_ENABLED:false}
    cron: "0 30 4 * * *"
    time-zone: Asia/Seoul
    retention: 30d
    batch-size: 1000

metrics:
  user-activity:
    enabled: ${management.otlp.metrics.export.enabled:false}
  container-memory:
    enabled: ${management.otlp.metrics.export.enabled:false}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:vium}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}

images:
  storage:
    enabled: ${IMAGE_STORAGE_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    private-bucket: ${S3_PRIVATE_BUCKET:}
    public-bucket: ${S3_PUBLIC_BUCKET:}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}

trade:
  auto-complete:
    enabled: ${TRADE_AUTO_COMPLETE_ENABLED:false}
    cron: ${TRADE_AUTO_COMPLETE_CRON:0 */10 * * * *}
    time-zone: ${TRADE_AUTO_COMPLETE_TIMEZONE:Asia/Seoul}

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-json: ${FCM_CREDENTIALS_JSON:}
  timeout-seconds: ${FCM_TIMEOUT_SECONDS:10}

push:
  expiry:
    enabled: ${PUSH_EXPIRY_ENABLED:false}
    cron: ${PUSH_EXPIRY_CRON:0 0 9 * * *}
    time-zone: ${PUSH_EXPIRY_TIMEZONE:Asia/Seoul}
  consume-check:
    enabled: ${PUSH_CONSUME_CHECK_ENABLED:false}
    cron: ${PUSH_CONSUME_CHECK_CRON:0 0 20 * * *}
    time-zone: ${PUSH_CONSUME_CHECK_TIMEZONE:Asia/Seoul}
  shopping-reminder:
    enabled: ${PUSH_SHOPPING_REMINDER_ENABLED:false}
    cron: ${PUSH_SHOPPING_REMINDER_CRON:0 0 10 * * SAT}
    time-zone: ${PUSH_SHOPPING_REMINDER_TIMEZONE:Asia/Seoul}
  chat:
    executor:
      core-size: 2
      max-size: 4
      queue-capacity: 100

sse:
  heartbeat-interval-seconds: 25
  max-connections-per-user: 3
  max-connection-age-seconds: 1800
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 100
