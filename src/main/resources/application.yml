spring:
  application:
    name: vium-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: debug

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:vium}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
