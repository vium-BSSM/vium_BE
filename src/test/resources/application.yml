spring:
  datasource:
    url: jdbc:h2:mem:vium-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

security:
  jwt:
    # Public test-only key. Never use outside tests.
    secret: dml1bS10ZXN0LW9ubHktc2lnbmluZy1rZXktMzItYnl0ZXM=
    issuer: vium-test
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
