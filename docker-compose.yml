services:
  postgres:
    image: postgres:16-alpine
    container_name: vium-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vium
      POSTGRES_USER: vium
      POSTGRES_PASSWORD: vium
    volumes:
      - vium-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vium -d vium"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vium-postgres-data:
