name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    name: Test and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Dockerfile runs Gradle test and bootJar with Java 21.
      # Fresh hosted runners do not restore Docker build caches.
      - name: Test and build production image
        run: >-
          docker build --platform linux/amd64
          --progress plain --tag "vium-be:ci-${GITHUB_SHA}" .

      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy/remote.sh
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
