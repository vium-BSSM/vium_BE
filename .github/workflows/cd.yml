name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never interrupt a deployment midway. Pending runs can be replaced by newer runs.
concurrency:
  group: vium-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ''
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          test -n "$ECR_REPOSITORY"
          test -n "$EC2_INSTANCE_ID"
          bash -n scripts/deploy/remote.sh
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
      # This Dockerfile executes test bootJar; CD never deploys after a failed build.
      - name: Test and build image
        run: docker build --platform linux/amd64 --progress plain -t "vium-be:${GITHUB_SHA}" .
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: vium-${{ github.run_id }}
      - name: Publish image and deploy through SSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy/release.py
